services:
  tools:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./web:/usr/share/nginx/html:ro"]
    restart: unless-stopped
  againface:
    image: python:3.12-slim
    working_dir: /app
    command: ["python3", "app.py"]
    environment: {PORT: "8080", APP_HOST: "0.0.0.0", DATA_DIR: /data, APP_DATA_CAP_MB: "100", PYTHONDONTWRITEBYTECODE: "1", PUBLIC_BASE_URL: "http://localhost:9001"}
    ports: ["127.0.0.1:9001:8080"]
    volumes: ["./apps/againface:/app:ro", "againface-data:/data"]
    read_only: true
    tmpfs: ["/tmp"]
    restart: unless-stopped
